# SellerBuz — Nginx site config
# Save as: /etc/nginx/sites-available/sellerbuz
# Then: ln -s /etc/nginx/sites-available/sellerbuz /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;

    # আপনার ডোমেইন বসান
    server_name your-domain.com www.your-domain.com;

    # build output এখানে রাখা হবে
    root /var/www/sellerbuz;
    index index.html;

    # SPA / single-file: যেকোনো path হলে index.html ফেরত দাও
    location / {
        try_files $uri $uri/ /index.html;
    }

    # static assets ক্যাশ (singlefile বিল্ডে বেশিরভাগই index.html-এর ভেতরে থাকে)
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
}
